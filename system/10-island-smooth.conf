# TLP drop-in: makes the three power profiles clearly different while keeping
# the island smooth. TLP profiles map to: Performance = *_ON_AC,
# Balanced = *_ON_BAT (on battery), Power Saver = *_ON_SAV (unchanged).
# The Intel GPU MIN/MAX/BOOST values must always be set together.

# Performance: CPU at full eagerness, iGPU never drops below 600 MHz.
CPU_ENERGY_PERF_POLICY_ON_AC=performance
INTEL_GPU_MIN_FREQ_ON_AC=600
INTEL_GPU_MAX_FREQ_ON_AC=1100
INTEL_GPU_BOOST_FREQ_ON_AC=1100

# Balanced: responsive enough for smooth animations (was balance_power).
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
INTEL_GPU_MIN_FREQ_ON_BAT=450
INTEL_GPU_MAX_FREQ_ON_BAT=1100
INTEL_GPU_BOOST_FREQ_ON_BAT=1100
